name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment(s) to run against
        type: choice
        default: both
        options:
          - stage
          - uat
          - both
  schedule:
    # Nightly full run against both environments (02:00 UTC)
    - cron: '0 2 * * *'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which environments to run based on the trigger.
  # - Pull requests: stage only (fast feedback).
  # - Manual dispatch: whatever the user picked.
  # - Push / schedule: both.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.pick.outputs.environments }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'environments=["stage"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.environment }}" in
              stage) echo 'environments=["stage"]' >> "$GITHUB_OUTPUT" ;;
              uat)   echo 'environments=["uat"]'   >> "$GITHUB_OUTPUT" ;;
              *)     echo 'environments=["stage","uat"]' >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo 'environments=["stage","uat"]' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: prepare
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.prepare.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Write ${{ matrix.environment }} config
        env:
          STAGE_ORIGIN: ${{ secrets.STAGE_ORIGIN }}
          STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
          STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
          STAGE_PARENT_USERNAME: ${{ secrets.STAGE_PARENT_USERNAME }}
          STAGE_PARENT_PASSWORD: ${{ secrets.STAGE_PARENT_PASSWORD }}
          UAT_ORIGIN: ${{ secrets.UAT_ORIGIN }}
          UAT_USERNAME: ${{ secrets.UAT_USERNAME }}
          UAT_PASSWORD: ${{ secrets.UAT_PASSWORD }}
          UAT_PARENT_USERNAME: ${{ secrets.UAT_PARENT_USERNAME }}
          UAT_PARENT_PASSWORD: ${{ secrets.UAT_PARENT_PASSWORD }}
        run: node scripts/write-ci-config.mjs "${{ matrix.environment }}"

      - name: Run E2E tests (${{ matrix.environment }})
        env:
          TEST_ENV: ${{ matrix.environment }}
          CI: 'true'
        run: npx playwright test --project=chromium --workers=1

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.environment }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.environment }}
          path: test-results/
          retention-days: 7
